# Read-only SPARQL proxy in front of qEndpoint.
#
# qEndpoint's /api/endpoint/sparql runs SPARQL UPDATE when it receives an
# `update` parameter, or any request body whose Content-Type is not exactly
# "application/sparql-query" (it compares the header with String.equals).
# Filtering out "bad" requests is not enough, so only two request shapes are
# forwarded, and everything else is rejected with 403:
#
#   - GET/HEAD with a non-empty `query` parameter. Only `query` is sent
#     upstream; every other parameter (including `update`) is dropped.
#   - POST with Content-Type exactly "application/sparql-query". The query
#     string is dropped, so an `update` parameter cannot ride along.
#
# Form-encoded POST (SPARQL protocol "query via URL-encoded POST") is not
# supported: nginx cannot see whether the body holds `query=` or `update=`.

upstream qendpoint_backend {
    server qendpoint:1234;
}

# 1 if the request carries a non-empty `query` parameter.
map $arg_query $sparql_has_query_arg {
    ""      0;
    default 1;
}

# 1 if the body is a raw SPARQL query. Case-sensitive and anchored on both
# ends, because qEndpoint treats any other value (e.g. with "; charset=utf-8"
# or different casing) as an update.
map $http_content_type $sparql_is_query_body {
    default                         0;
    "~^application/sparql-query$"   1;
}

map $request_method $sparql_request_ok {
    GET     $sparql_has_query_arg;
    HEAD    $sparql_has_query_arg;
    POST    $sparql_is_query_body;
    default 0;
}

# Upstream URI per method; never contains anything but the query.
map $request_method $sparql_upstream_uri {
    POST    /api/endpoint/sparql;
    default /api/endpoint/sparql?query=$arg_query;
}

server {
    listen 80;

    # Exact match, so /sparqlX cannot be mapped onto other backend paths.
    location = /sparql {
        # GET also allows HEAD.
        limit_except GET POST {
            deny all;
        }

        if ($sparql_request_ok = 0) {
            return 403;
        }

        # proxy_pass with variables sends exactly this URI and does not
        # append the client's query string.
        proxy_pass http://qendpoint_backend$sparql_upstream_uri;

        # Send the single Content-Type value checked above (empty for GET,
        # which drops the header), so a duplicate header cannot reach qEndpoint.
        proxy_set_header Content-Type $http_content_type;

        # Preserve original Host header for backend routing/validation
        proxy_set_header Host $host;

        # Forward client IP, useful for backend logging/security
        proxy_set_header X-Real-IP $remote_addr;

        # Hide backend framework info from clients by removing X-Powered-By header
        proxy_hide_header X-Powered-By;
    }

    # Proxy static files (web UI)
    location / {
        # Allow only GET and HEAD for static content
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://geonames-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }
}
